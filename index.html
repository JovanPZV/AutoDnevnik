/* =========================================================
   EXPORT / IMPORT
   ========================================================= */
function download(filename, content, mime){
  try {
    const blob = new Blob([content], {type:mime});
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = filename; a.rel = 'noopener';
    document.body.appendChild(a);
    a.click();
    setTimeout(() => { document.body.removeChild(a); URL.revokeObjectURL(url); }, 2000);
    toast('Preuzimanje: ' + filename);
  } catch(e){
    toast('Preuzimanje nije uspelo na ovom uređaju.', 'bad');
  }
}
function fileSlug(){
  return (state.settings.carName || 'auto').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/đ/g,'dj').replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'') || 'auto';
}
function csvCell(v){
  const s = String(v == null ? '' : v);
  return /[";\n\r]/.test(s) ? '"' + s.replace(/"/g,'""') + '"' : s;
}
function csvNum(n, d){
  if (n == null || !isFinite(n)) return '';
  return Number(n).toFixed(d).replace('.', ',');
}
function toCSV(rows){ return '\uFEFF' + rows.map(r => r.map(csvCell).join(';')).join('\r\n'); }

async function exportJSON(withPhotos){
  db.vehicles[state.id] = state;
  const data = {app:'Auto dnevnik', version:2, exportedAt:new Date().toISOString(), activeId:db.activeId, order:db.order.slice(), vehicles:db.order.map(id => db.vehicles[id])};
  if (withPhotos && Photos.available()){
    toast('Pripremam kopiju...');
    data.photos = {};
    const ids = [];
    db.order.forEach(id => vehiclePhotoIds(db.vehicles[id]).forEach(p => ids.push(p)));
    for (const id of ids){
      try { const d = await loadPhoto(id); if (d) data.photos[id] = d; } catch(e){}
    }
  }
  download('auto-dnevnik-' + (withPhotos ? 'sa-fotografijama-' : '') + todayISO() + '.json', JSON.stringify(data), 'application/json');
}
function exportCSV(what){
  const cur = state.settings.currency, slug = fileSlug(), day = todayISO();
  let rows, name;
  if (what === 'fuel'){
    if (!state.fuel.length) return toast('Nema sipanja za izvoz.', 'bad');
    const fs = fuelStats();
    rows = [['Datum','Kilometraža','Litara','Plaćeno','Valuta','Cena po litru','Pun do vrha','Pređeno od prethodnog (km)','Potrošnja (l/100km)','Cena po km','Napomena']];
    state.fuel.slice().sort((a,b) => (a.km - b.km) || a.date.localeCompare(b.date)).forEach(f => {
      const r = fs.per[f.id] || {};
      rows.push([fmtDate(f.date), f.km, csvNum(f.liters,2), csvNum(f.price,2), cur, csvNum(r.ppl,2), f.full ? 'DA' : 'NE', r.sincePrev != null ? r.sincePrev : '', csvNum(r.cons,2), csvNum(r.cpk,2), f.note]);
    });
    rows.push([]); rows.push(['Ukupno','',csvNum(fs.totalLiters,2),csvNum(fs.totalCost,2),cur,'','','',csvNum(fs.avg,2),csvNum(fs.cpk,2)]);
    name = 'gorivo';
  } else if (what === 'service'){
    if (!state.services.length) return toast('Nema servisa za izvoz.', 'bad');
    rows = [['Datum','Kilometraža','Vrsta servisa','Plaćeno','Valuta','Opis i zamenjeni delovi','Sledeći servis (km)','Sledeći servis (datum)','Napomena za sledeći']];
    state.services.slice().sort((a,b) => a.date.localeCompare(b.date) || (a.km - b.km)).forEach(s => {
      rows.push([fmtDate(s.date), s.km, s.type, csvNum(s.price,2), cur, s.desc, s.nextKm || '', s.nextDate ? fmtDate(s.nextDate) : '', s.nextNote]);
    });
    rows.push([]); rows.push(['Ukupno','','',csvNum(sum(state.services,'price'),2),cur]);
    name = 'servisi';
  } else if (what === 'docs'){
    if (!state.registrations.length) return toast('Nema registracija za izvoz.', 'bad');
    rows = [['Datum','Važi do','Kilometraža','Tehnički pregled','Obavezno osiguranje','Porez i takse','Ostalo','Ukupno','Valuta','Agencija','Napomena']];
    state.registrations.slice().sort((a,b) => a.date.localeCompare(b.date)).forEach(r => {
      rows.push([fmtDate(r.date), fmtDate(r.validUntil), r.km != null ? r.km : '', csvNum(r.inspection,2), csvNum(r.insurance,2), csvNum(r.taxes,2), csvNum(r.other,2), csvNum(regTotal(r),2), cur, r.agency, r.note]);
    });
    rows.push([]); rows.push(['Ukupno','','','','','','',csvNum(docsTotal(),2),cur]);
    name = 'registracija';
  } else if (what === 'expense'){
    if (!state.expenses.length) return toast('Nema troškova za izvoz.', 'bad');
    rows = [['Datum','Vrsta','Iznos','Valuta','Kilometraža','Napomena']];
    state.expenses.slice().sort((a,b) => a.date.localeCompare(b.date)).forEach(x => {
      rows.push([fmtDate(x.date), x.type, csvNum(x.price,2), cur, x.km != null ? x.km : '', x.note]);
    });
    rows.push([]); rows.push(['Ukupno','',csvNum(sum(state.expenses,'price'),2),cur]);
    name = 'ostali-troskovi';
  } else if (what === 'info'){
    rows = [['Grupa','Podatak','Vrednost']];
    INFO_GROUPS.forEach(g => g.fields.forEach(f => { const v = infoDisplay(f, infoVal(f)); if (v) rows.push([g.title, f.label, v]); }));
    state.info.custom.forEach(c => rows.push(['Dodatno', c.label, c.value]));
    if (rows.length === 1) return toast('Podaci o vozilu nisu uneti.', 'bad');
    name = 'podaci-o-vozilu';
  } else {
    const yrs = yearlyRows();
    if (!yrs.length) return toast('Nema podataka za godišnji pregled.', 'bad');
    rows = [['Godina','Gorivo','Servisi','Registracija','Ostali troškovi','Ukupno','Pređeno km','Trošak po km','Valuta']];
    yrs.forEach(y => rows.push([y.year, csvNum(y.t.fuel,2), csvNum(y.t.service,2), csvNum(y.t.docs,2), csvNum(y.t.other,2), csvNum(y.total,2), y.driven || '', csvNum(y.perKm,2), cur]));
    name = 'godisnji-pregled';
  }
  download(name + '-' + slug + '-' + day + '.csv', toCSV(rows), 'text/csv;charset=utf-8');
}
function importJSON(file){
  const reader = new FileReader();
  reader.onload = async () => {
    let data;
    try { data = JSON.parse(reader.result); }
    catch(e){ return toast('Fajl nije ispravan JSON.', 'bad'); }
    if (!data || typeof data !== 'object' || !(data.vehicles || Array.isArray(data.fuel) || Array.isArray(data.services) || Array.isArray(data.registrations) || data.tires)){
      return toast('Ovo nije kopija iz Auto dnevnika.', 'bad');
    }
    if (data.vehicles){
      const n = Array.isArray(data.vehicles) ? data.vehicles.length : Object.keys(data.vehicles).length;
      if (!confirm('Kopija sadrži ' + n + ' ' + plural(n,'vozilo','vozila','vozila') + '.\n\nSvi trenutni podaci na telefonu biće zamenjeni. Nastaviti?')) return;
      db = normalizeDB(data);
    } else {
      if (!confirm('Ovo je kopija jednog vozila (starija verzija).\n\nZameniće podatke vozila „' + state.settings.carName + '“. Nastaviti?')) return;
      const v = normalizeVehicle(data);
      v.id = state.id;
      db.vehicles[state.id] = v;
    }
    state = db.vehicles[db.activeId];
    if (data.photos && typeof data.photos === 'object' && Photos.available()){
      const ids = Object.keys(data.photos);
      for (const id of ids){
        try { await Photos.put(id, data.photos[id]); photoCache[id] = data.photos[id]; } catch(e){}
      }
    }
    if (save()){ renderAll(); toast('Podaci vraćeni iz kopije'); }
  };
  reader.onerror = () => toast('Fajl nije moguće pročitati.', 'bad');
  reader.readAsText(file);
}

/* =========================================================
   ZAJEDNIČKE AKCIJE
   ========================================================= */
function upsert(kind, entry){
  const arr = state[COLL[kind]];
  const i = arr.findIndex(x => x.id === entry.id);
  if (i > -1) arr[i] = entry; else arr.push(entry);
}
const DEL_TEXT = {
  fuel:['Obrisati ovo sipanje?','Sipanje obrisano'],
  service:['Obrisati ovaj servis?','Servis obrisan'],
  reg:['Obrisati ovu registraciju?','Registracija obrisana'],
  expense:['Obrisati ovaj trošak?','Trošak obrisan']
};
function deleteEntry(kind, id){
  const arr = state[COLL[kind]];
  const e = arr.find(x => x.id === id);
  if (!e || !confirm(DEL_TEXT[kind][0])) return;
  state[COLL[kind]] = arr.filter(x => x.id !== id);
  if (save()){ deletePhotos(e.photos); renderAll(); toast(DEL_TEXT[kind][1]); }
}
const EDIT_FN = {fuel:openFuelForm, service:openServiceForm, reg:openRegForm, expense:openExpenseForm};

/* =========================================================
   SHEET, TOAST, NAVIGACIJA
   ========================================================= */
function openSheet(){
  const sh = $('#sheet');
  sh.classList.add('open');
  sh.setAttribute('aria-hidden','false');
  document.body.style.overflow = 'hidden';
  $('.sheet').scrollTop = 0;
}
function closeSheet(){
  if (sheetOnClose){ const f = sheetOnClose; sheetOnClose = null; try { f(); } catch(e){} }
  const sh = $('#sheet');
  sh.classList.remove('open');
  sh.setAttribute('aria-hidden','true');
  document.body.style.overflow = '';
}
let toastTimer = null;
function toast(msg, kind){
  const t = $('#toast');
  t.textContent = msg;
  t.classList.toggle('bad', kind === 'bad');
  t.classList.toggle('warn', kind === 'warn');
  t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove('show'), kind === 'warn' ? 4500 : 2600);
}
function switchTab(tab){
  if (!TAB_TITLES[tab]) return;
  currentTab = tab;
  const navTab = SUBPAGES.indexOf(tab) > -1 ? 'more' : tab;
  document.querySelectorAll('.tab').forEach(s => s.classList.toggle('active', s.id === 'tab-' + tab));
  document.querySelectorAll('.bottom-nav button').forEach(b => b.classList.toggle('active', b.dataset.tab === navTab));
  renderHeader();
  window.scrollTo(0, 0);
  try { history.replaceState(null, '', '#' + tab); } catch(e){}
}
function renderAll(){
  renderHeader();
  renderDash();
  renderFuel();
  renderService();
  renderExpense();
  renderDocs();
  renderMore();
  renderInfo();
  renderStats();
  renderTires();
  renderCalc();
  renderVehicles();
  renderData();
}

document.addEventListener('click', e => {
  if (e.target === $('#sheet')){ closeSheet(); return; }
  const btn = e.target.closest('[data-action]');
  if (!btn) return;
  const a = btn.dataset.action, id = btn.dataset.id, kind = btn.dataset.kind;
  switch (a){
    case 'tab': closeSheet(); switchTab(btn.dataset.tab); break;
    case 'add-fuel': openFuelForm(); break;
    case 'add-service': openServiceForm(); break;
    case 'add-expense': openExpenseForm(); break;
    case 'add-reg': openRegForm(); break;
    case 'edit': if (EDIT_FN[kind]) EDIT_FN[kind](id); break;
    case 'del': if (DEL_TEXT[kind]) deleteEntry(kind, id); break;
    case 'view-photos': openPhotoViewer(kind, id); break;
    case 'svc-filter': serviceFilter = btn.dataset.type; renderService(); break;
    case 'exp-filter': expenseFilter = btn.dataset.type; renderExpense(); break;
    case 'edit-info': openInfoForm(); break;
    case 'copy': copyText(btn.dataset.value || '', 'Kopirano: ' + (btn.dataset.label || '')); break;
    case 'copy-info': copyText(infoText(), 'Svi podaci o vozilu su kopirani'); break;
    case 'share-info':
      if (navigator.share) navigator.share({title: state.settings.carName, text: infoText()}).catch(() => {});
      break;
    case 'close-sheet': closeSheet(); break;
    case 'swap-tires': openSwapForm(btn.dataset.kind); break;
    case 'new-tires': openNewTiresForm(btn.dataset.kind); break;
    case 'edit-tires': openTireForm(btn.dataset.kind); break;
    case 'month-prev': dashMonth = shiftMonth(dashMonth || monthKey(todayISO()), -1); renderDash(); break;
    case 'month-next': dashMonth = shiftMonth(dashMonth || monthKey(todayISO()), 1); renderDash(); break;
    case 'all-months': openMonthsSheet(); break;
    case 'pick-month': dashMonth = btn.dataset.month; closeSheet(); renderDash(); break;
    case 'switch-vehicle': openVehicleSheet(); break;
    case 'use-vehicle': closeSheet(); if (id !== db.activeId) switchVehicle(id); break;
    case 'goto-vehicles': closeSheet(); switchTab('vehicles'); break;
    case 'del-vehicle': {
      const v = db.vehicles[id];
      if (!v || db.order.length < 2) break;
      if (!confirm('Obrisati vozilo „' + v.settings.carName + '“ i sve njegove podatke?')) break;
      const photos = vehiclePhotoIds(v);
      delete db.vehicles[id];
      db.order = db.order.filter(x => x !== id);
      if (db.activeId === id){ db.activeId = db.order[0]; state = db.vehicles[db.activeId]; }
      if (save()){ deletePhotos(photos); renderAll(); toast('Vozilo obrisano'); }
      break;
    }
    case 'export-json': exportJSON(btn.dataset.photos === '1'); break;
    case 'export-csv': exportCSV(btn.dataset.what); break;
    case 'import': $('#importFile').value = ''; $('#importFile').click(); break;
    case 'reset':
      if (confirm('Obrisati SVE podatke i fotografije sa ovog uređaja?') && confirm('Ovo se ne može poništiti. Da li ste preuzeli JSON kopiju?')){
        db = freshDB();
        state = db.vehicles[db.activeId];
        if (Photos.available()) Photos.clear().catch(() => {});
        Object.keys(photoCache).forEach(k => delete photoCache[k]);
        try { localStorage.removeItem(LEGACY_KEY); } catch(e){}
        if (save()){ renderAll(); toast('Svi podaci obrisani'); }
      }
      break;
  }
});

$('#importFile').addEventListener('change', e => {
  const f = e.target.files && e.target.files[0];
  if (f) importJSON(f);
});
document.addEventListener('keydown', e => {
  if (e.key === 'Escape' && $('#sheet').classList.contains('open')) closeSheet();
});
window.addEventListener('storage', e => {
  if (e.key === DB_KEY){ db = loadDB(); state = db.vehicles[db.activeId]; renderAll(); }
});

/* =========================================================
   PWA: manifest i ikonica
   ========================================================= */
(function setupPWA(){
  try {
    const c = document.createElement('canvas');
    c.width = 512; c.height = 512;
    const g = c.getContext('2d');
    if (g){
      g.fillStyle = '#14181d'; g.fillRect(0,0,512,512);
      g.lineCap = 'round';
      g.strokeStyle = '#2e3640'; g.lineWidth = 34;
      g.beginPath(); g.arc(256, 290, 160, Math.PI * 0.8, Math.PI * 2.2); g.stroke();
      g.strokeStyle = '#f2a93b';
      g.beginPath(); g.arc(256, 290, 160, Math.PI * 0.8, Math.PI * 1.65); g.stroke();
      g.strokeStyle = '#e9edf1'; g.lineWidth = 22;
      g.beginPath(); g.moveTo(256, 290); g.lineTo(340, 200); g.stroke();
      g.fillStyle = '#e9edf1';
      g.beginPath(); g.arc(256, 290, 28, 0, Math.PI * 2); g.fill();
      const png = c.toDataURL('image/png');
      ['apple-touch-icon','icon'].forEach(rel => {
        const l = document.createElement('link'); l.rel = rel; l.href = png; document.head.appendChild(l);
      });
      const manifest = {
        name:'Auto dnevnik', short_name:'Auto dnevnik',
        description:'Evidencija goriva, servisa, registracije i troškova',
        start_url: location.href.split('#')[0], display:'standalone', orientation:'portrait',
        background_color:'#14181d', theme_color:'#14181d',
        icons:[{src:png, sizes:'512x512', type:'image/png', purpose:'any'},{src:png, sizes:'192x192', type:'image/png', purpose:'any'}]
      };
      const ml = document.createElement('link');
      ml.rel = 'manifest';
      ml.href = URL.createObjectURL(new Blob([JSON.stringify(manifest)], {type:'application/manifest+json'}));
      document.head.appendChild(ml);
    }
  } catch(e){}
  try { if (navigator.storage && navigator.storage.persist) navigator.storage.persist(); } catch(e){}
})();

/* =========================================================
   POKRETANJE
   ========================================================= */
renderAll();
const startTab = (location.hash || '').replace('#','');
if (TAB_TITLES[startTab]) switchTab(startTab);

})();
</script>
